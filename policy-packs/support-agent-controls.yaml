# Copy-ready support agent policy pack.
# Uses only Enforra v1 policy syntax.
#
# This pack is a starter template for the "Support Agent Safety" use case.
# It is not loaded by the demo directly.
#
# Related demo policy:
# - policies/starter/support-agent.yaml
# - examples/quickstart/support-refund-node/policies/observe-policy.yaml
# - pnpm demo:support-refund

version: 1

defaults:
  # Unknown support actions are blocked by default.
  decision: block

policies:
  - id: allow-small-refunds
    description: Allow low-risk refunds automatically
    match:
      agent: support-agent
      tool: stripe.refund
    conditions:
      - field: args.amount
        operator: lte
        value: 50
    decision: allow

  - id: require-approval-medium-refunds
    description: Require approval for refunds above the low-risk threshold
    match:
      agent: support-agent
      tool: stripe.refund
    conditions:
      all:
        - field: args.amount
          operator: gt
          value: 50
        - field: args.amount
          operator: lte
          value: 500
    decision: require_approval

  - id: block-large-refunds
    description: Block refunds above the maximum threshold
    match:
      agent: support-agent
      tool: stripe.refund
    conditions:
      - field: args.amount
        operator: gt
        value: 500
    decision: block

  - id: block-customer-delete-production
    description: Block customer/account deletion in production
    match:
      agent: support-agent
      tool: account.delete
    conditions:
      - field: context.environment
        operator: eq
        value: production
    decision: block

  - id: allow-customer-delete-non-production
    description: Allow customer/account deletion outside production
    match:
      agent: support-agent
      tool: account.delete
    conditions:
      - field: context.environment
        operator: neq
        value: production
    decision: allow

  # The task calls for logging customer reads.
  # No customer-read tool is demonstrated in the support refund example.
  # Example only — customize to match your application's lookup tool.
  #
  # - id: log-customer-read
  #   match:
  #     agent: support-agent
  #     tool: crm.lookup
  #   decision: log_only

  # The task calls for allowing low-risk lookups.
  # No lookup tool is demonstrated in the starter support demo.
  # Example only — customize to match your application's lookup tool.
  #
  # - id: allow-low-risk-lookup
  #   match:
  #     agent: support-agent
  #     tool: crm.lookup
  #   decision: allow
