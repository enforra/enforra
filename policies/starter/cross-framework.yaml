version: 1
defaults:
  decision: block
policies:
  # filesystem.read: safe file read -> allow
  # filesystem.read: .env read -> block
  - id: block-env-read
    description: Block reading .env files
    match:
      tool: filesystem.read
    conditions:
      - field: args.path
        operator: contains
        value: ".env"
    decision: block

  - id: allow-safe-file-read
    description: Allow safe file reads (paths without .env)
    match:
      tool: filesystem.read
    conditions:
      - field: args.path
        operator: not_contains
        value: ".env"
    decision: allow

  # terminal.run -> require_approval
  - id: approve-terminal-run
    description: Require approval for all terminal runs
    match:
      tool: terminal.run
    decision: require_approval

  # github.create_issue -> log_only
  - id: log-github-issue
    description: Log github issue creation without blocking
    match:
      tool: github.create_issue
    decision: log_only

  # support.refund: small refund -> allow (amount <= 50)
  # support.refund: large refund -> block (amount > 50)
  - id: block-large-refund
    description: Block refunds greater than $50
    match:
      tool: support.refund
    conditions:
      - field: args.amount
        operator: gt
        value: 50
    decision: block

  - id: allow-small-refund
    description: Allow refunds of $50 or less
    match:
      tool: support.refund
    conditions:
      - field: args.amount
        operator: lte
        value: 50
    decision: allow
